# 설치 파일 배포 (V79). v로 시작하는 태그(package.json의 version과 같아야 한다)를 push하면
# Windows NSIS 설치 파일과 WSL(Linux)용 .deb를 만들어 GitHub Releases의 초안(draft)에 올린다.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  dist:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx electron-vite build
      - run: npx electron-builder ${{ matrix.target }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
